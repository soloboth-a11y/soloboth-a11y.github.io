<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>シールあつめ</title>
<style>
  :root {
    --bg: #fff8e7;
    --card: #ffffff;
    --ink: #3b3355;
    --sub: #8a83a3;
    --accent: #ff8a5b;
    --accent-dark: #e86a3a;
    --accent-soft: #ffe3d3;
    --good: #3cc47c;
    --good-dark: #2a9a5f;
    --good-soft: #e8fbf1;
    --bad: #ff5b6e;
    --bad-soft: #ffe3e7;
    --dot: #ff8a5b;
    --dot-empty: #efe9f7;
    --dot-line: #d8cfe8;
    --track: #f1ecdf;
    --star: #ffe27a;
    --shadow: #e6dcc4;
    --on-accent: #ffffff;
    --muted: #d6ccb4;
    --scrim: rgba(59, 51, 85, .55);
    --cap-blue: #5b9dff;
    --cap-pink: #ff6fae;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #1f1b2e; --card: #2c2740; --ink: #f4efff; --sub: #a9a1c4;
      --accent: #ff9a6e; --accent-dark: #c9592e; --accent-soft: #4a2c22; --good: #4fd68e; --good-dark: #2a9a5f;
      --good-soft: #1f3b2e; --bad: #ff7585; --bad-soft: #43242c; --dot: #ff9a6e;
      --dot-empty: #3a3452; --dot-line: #554d70; --track: #3a3452; --star: #c9a92e;
      --shadow: #151221; --on-accent: #ffffff; --muted: #5d5678; --scrim: rgba(0,0,0,.6);
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #1f1b2e; --card: #2c2740; --ink: #f4efff; --sub: #a9a1c4;
    --accent: #ff9a6e; --accent-dark: #c9592e; --accent-soft: #4a2c22; --good: #4fd68e; --good-dark: #2a9a5f;
    --good-soft: #1f3b2e; --bad: #ff7585; --bad-soft: #43242c; --dot: #ff9a6e;
    --dot-empty: #3a3452; --dot-line: #554d70; --track: #3a3452; --star: #c9a92e;
    --shadow: #151221; --on-accent: #ffffff; --muted: #5d5678; --scrim: rgba(0,0,0,.6);
    color-scheme: dark;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html { height: 100%; }
  body { margin: 0; min-height: 100%; }  /* なかみが ながいときは ページごと スクロール */
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: "Hiragino Maru Gothic ProN", "Rounded Mplus 1c", "M PLUS Rounded 1c", "Yu Gothic", system-ui, sans-serif;
    display: flex; flex-direction: column; align-items: center;
    padding-block: 16px;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    user-select: none;
  }
  header { width: 100%; max-width: 520px; display: flex; justify-content: space-between; align-items: center; }
  h1 { font-size: 22px; margin: 0; letter-spacing: .05em; }
  .book-btn {
    border: none; background: var(--card); color: var(--ink); font: inherit; font-size: 16px;
    padding: 8px 14px; border-radius: 999px; box-shadow: 0 2px 0 var(--shadow); cursor: pointer;
  }
  main { width: 100%; max-width: 520px; display: flex; flex-direction: column; gap: 16px; margin-top: 16px; }

  .progress { display: grid; grid-template-columns: repeat(10, 1fr); gap: 6px; }
  .progress span {
    aspect-ratio: 1; border-radius: 50%; background: var(--track);
    display: grid; place-items: center; font-size: clamp(14px, 4.5vw, 24px);
    transition: transform .3s;
  }
  .progress span.on { background: var(--star); transform: scale(1.1); }

  .card {
    background: var(--card); border-radius: 28px; padding: 24px 16px;
    box-shadow: 0 4px 0 var(--shadow); text-align: center;
  }
  .equation { font-size: clamp(48px, 16vw, 84px); font-weight: 800; display: flex; justify-content: center; align-items: center; gap: .25em; }
  .blank {
    display: inline-grid; place-items: center; min-width: 1.3em; height: 1.3em;
    border: 4px dashed var(--accent); border-radius: 18px; color: var(--accent);
  }
  .blank.filled { border-style: solid; background: var(--good-soft); border-color: var(--good); color: var(--good); }

  .frame { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; max-width: 300px; margin: 18px auto 0; }
  .frame[hidden] { display: none; }
  .frame i {
    aspect-ratio: 1; border-radius: 50%; background: var(--dot-empty);
    border: 3px dashed var(--dot-line); transition: background .3s, border-color .3s;
  }
  .frame i.on { background: var(--dot); border: 3px solid var(--dot); }
  .frame i.add { background: var(--good); border: 3px solid var(--good); }

  .choices { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
  .choices button {
    font: inherit; font-size: clamp(28px, 9vw, 48px); font-weight: 800; color: var(--ink);
    background: var(--card); border: none; border-radius: 20px; padding: 14px 0;
    box-shadow: 0 6px 0 var(--shadow); cursor: pointer; transition: transform .08s;
  }
  .choices button:active { transform: translateY(4px); box-shadow: 0 2px 0 var(--shadow); }
  .choices button.wrong { background: var(--bad-soft); color: var(--bad); animation: shake .4s; }
  .choices button.right { background: var(--good); color: var(--on-accent); box-shadow: 0 6px 0 var(--good-dark); }
  .choices button:disabled { cursor: default; }
  .choices button.reveal { outline: 4px solid var(--good); outline-offset: -4px; color: var(--good); }
  @keyframes shake { 0%,100%{transform:translateX(0)} 25%{transform:translateX(-8px)} 75%{transform:translateX(8px)} }

  .message { text-align: center; font-size: 22px; min-height: 1.5em; font-weight: 700; }
  .message.good { color: var(--good); }
  .message.bad { color: var(--bad); }

  /* overlays */
  .overlay {
    position: fixed; inset: 0; background: var(--scrim);
    display: none; justify-content: center; z-index: 10;
    padding: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px))
             max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
    overflow-y: auto; overscroll-behavior: contain; -webkit-overflow-scrolling: touch;
  }
  .overlay.show { display: flex; }
  .panel {
    background: var(--card); border-radius: 28px; padding: 24px 20px; width: 100%; max-width: 420px;
    text-align: center; margin: auto; /* 画面より たかいときは ポップアップごと スクロール */
  }
  .panel h2 { margin: 0 0 8px; font-size: 26px; }
  .sticker-big {
    font-size: 120px; line-height: 1; margin: 12px 0;
    animation: pop .7s cubic-bezier(.2, 1.6, .4, 1);
  }
  @keyframes pop { 0%{transform:scale(0) rotate(-30deg)} 100%{transform:scale(1) rotate(0)} }
  .primary {
    font: inherit; font-size: 22px; font-weight: 800; color: var(--on-accent); background: var(--accent);
    border: none; border-radius: 999px; padding: 12px 32px; box-shadow: 0 5px 0 var(--accent-dark);
    cursor: pointer; margin-top: 12px;
  }
  .primary:active { transform: translateY(3px); box-shadow: 0 2px 0 var(--accent-dark); }
  .book { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; margin: 16px 0; }
  .book div {
    aspect-ratio: 1; border-radius: 16px; background: var(--track);
    display: grid; place-items: center; font-size: 34px;
  }
  .sticker-big img { width: 160px; height: 160px; max-width: 100%; object-fit: contain; display: block; margin: 0 auto; }
  .book div { overflow: hidden; position: relative; }
  /* がぞうの ぜんぶが ますの なかに はいるように（たて長・よこ長でも） */
  .book div img { position: absolute; inset: 0; margin: auto; width: 85%; height: 85%; object-fit: contain; }
  .book-summary { display: grid; grid-template-columns: repeat(auto-fit, minmax(96px, 1fr)); gap: 6px; margin-top: 12px; }
  .book-summary .item {
    display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 8px 4px;
    border-radius: 14px; background: var(--track); font-size: 13px; font-weight: 700;
  }
  .book-summary .item b { font-size: 18px; }
  .book-summary .item .icon { font-size: 20px; line-height: 1; }
  .book div.empty { color: var(--muted); font-size: 20px; }
  button:focus-visible { outline: 4px solid var(--accent); outline-offset: 3px; }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .01ms !important; transition: none !important; }
    .confetti { display: none; }
  }
  .sub { color: var(--sub); font-size: 15px; }

  .confetti { position: fixed; top: -40px; font-size: 28px; pointer-events: none; z-index: 20; animation: fall linear forwards; }
  @keyframes fall { to { transform: translateY(110vh) rotate(540deg); } }

  [hidden] { display: none !important; }
  .sprite-zone { flex: 1; min-width: 0; height: 56px; position: relative; margin: 0 6px; }
  .sprite { position: absolute; background-repeat: no-repeat; pointer-events: none; }
  header .left { display: flex; align-items: center; gap: 10px; min-width: 0; }
  header h1 { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 20px; }
  .book-btn { white-space: nowrap; flex-shrink: 0; }
  .back-btn {
    border: none; background: var(--card); color: var(--ink); font: inherit; font-size: 16px; font-weight: 700;
    padding: 8px 14px; border-radius: 999px; box-shadow: 0 2px 0 var(--shadow); cursor: pointer; white-space: nowrap;
  }

  /* menu */
  .menu-title { font-size: 20px; font-weight: 800; margin: 4px 0 0; text-align: center; }
  .kinds { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
  .kind {
    font: inherit; font-size: 15px; font-weight: 800; color: var(--ink); background: var(--card);
    border: none; border-radius: 20px; padding: 12px 4px; box-shadow: 0 4px 0 var(--shadow); cursor: pointer;
    display: flex; flex-direction: column; align-items: center; gap: 2px;
  }
  .kind b { font-size: 30px; line-height: 1.1; }
  .kind { font-size: 13px; padding: 10px 2px; white-space: pre-line; line-height: 1.2; }
  .clock { display: block; width: min(210px, 58vw); height: auto; margin: 0 auto 8px; }
  .clock .face { fill: var(--card); stroke: var(--ink); stroke-width: 6; }
  .clock .tick { stroke: var(--sub); stroke-width: 2; stroke-linecap: round; }
  .clock .tick.major { stroke: var(--ink); stroke-width: 4; }
  .clock .num { fill: var(--ink); font-size: 22px; font-weight: 800; font-family: inherit; text-anchor: middle; dominant-baseline: central; }
  .clock .hour { stroke: var(--accent); stroke-width: 10; stroke-linecap: round; }
  .clock .minute { stroke: var(--ink); stroke-width: 6; stroke-linecap: round; }
  .clock .pin { fill: var(--ink); }
  .equation.clock-answer { font-size: clamp(26px, 8vw, 40px); }
  .choices.wide { grid-template-columns: repeat(2, 1fr); }
  .choices.wide button { font-size: clamp(20px, 6.5vw, 30px); padding: 12px 0; white-space: nowrap; }
  .kind[aria-pressed="true"] { background: var(--accent); color: var(--on-accent); box-shadow: 0 4px 0 var(--accent-dark); }
  .levels { display: flex; flex-direction: column; gap: 12px; }
  .level {
    display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 14px;
    font: inherit; color: var(--ink); text-align: left; background: var(--card); border: none;
    border-radius: 22px; padding: 14px 16px; box-shadow: 0 5px 0 var(--shadow); cursor: pointer;
  }
  .level:active { transform: translateY(3px); box-shadow: 0 2px 0 var(--shadow); }
  .level .lv { font-size: 18px; font-weight: 800; white-space: nowrap; color: var(--accent); }
  .level .body { min-width: 0; }
  .level .ex { font-size: 22px; font-weight: 800; white-space: nowrap; }
  .level .desc { font-size: 13px; color: var(--sub); }
  .level .reward { font-size: 12px; color: var(--sub); text-align: center; white-space: nowrap; }
  .level .reward span { display: block; font-size: 16px; letter-spacing: -2px; }
  .level .reward .got { font-size: 12px; letter-spacing: 0; color: var(--ink); font-weight: 800; margin-top: 2px; }
  .kind small { font-size: 11px; font-weight: 700; opacity: .85; }

  .equation { flex-wrap: wrap; }
  .equation.long { font-size: clamp(28px, 8.5vw, 56px); gap: .18em; }
  .blank { padding: 0 .12em; }

  .reward-stickers { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; margin: 12px 0; }
  .reward-stickers .sticker-big { margin: 0; animation-fill-mode: both; }
  .reward-stickers.many .sticker-big { font-size: 56px; }
  .reward-stickers.many .sticker-big img { width: 64px; height: 64px; }
  .head-btns { display: flex; gap: 6px; flex-shrink: 0; }
  #calBtn { padding: 8px 10px; font-size: 18px; }

  /* calendar */
  .cal-panel { padding: 20px 8px; }
  .cal-nav { display: flex; align-items: center; gap: 2px; margin: 12px 0 4px; }
  .cal-arrow {
    flex: 0 0 28px; height: 56px; border: none; border-radius: 12px; background: var(--track);
    color: var(--ink); font: inherit; font-size: 26px; font-weight: 800; cursor: pointer; padding: 0;
  }
  .cal-arrow:disabled { opacity: .3; cursor: default; }
  .cal-strip {
    flex: 1; min-width: 0; display: flex; overflow-x: auto; scroll-snap-type: x mandatory;
    scrollbar-width: none; overscroll-behavior-x: contain;
  }
  .cal-strip::-webkit-scrollbar { display: none; }
  .cal-month { flex: 0 0 100%; scroll-snap-align: start; padding: 0 2px; }
  .cal-month h3 { margin: 0 0 8px; font-size: 18px; }
  .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 3px; }
  .cal-grid .wd { font-size: 12px; font-weight: 700; color: var(--sub); padding: 2px 0; }
  .cal-grid .wd.sun { color: var(--bad); }
  .day {
    min-width: 0; aspect-ratio: 1 / 1.3; border-radius: 10px; background: var(--track); color: var(--ink);
    display: flex; flex-direction: column; align-items: center; justify-content: flex-start; gap: 1px;
    padding: 3px 0 0; font: inherit; font-size: 11px; line-height: 1.15; border: none;
  }
  .day.blank { background: transparent; }
  .day .n { font-size: 12px; font-weight: 700; color: var(--sub); }
  .day .got { font-size: 12px; font-weight: 800; white-space: nowrap; }
  .day .bonus { font-size: 12px; font-weight: 800; white-space: nowrap; }
  .day.has { background: var(--star); }
  .day.has .n { color: var(--ink); }
  .day.today { box-shadow: inset 0 0 0 3px var(--accent); }
  button.day.claim {
    background: var(--accent); color: var(--on-accent); cursor: pointer;
    box-shadow: 0 3px 0 var(--accent-dark); animation: wiggle 1.2s ease-in-out infinite;
  }
  button.day.claim .n { color: var(--on-accent); }
  /* gacha */
  .gacha-panel { padding: 20px 12px; }
  .gacha-count { font-size: 15px; font-weight: 800; color: var(--accent); }
  .gacha { position: relative; width: 220px; height: 432px; margin: 6px auto 0; }
  .gacha .dome {
    position: absolute; left: 20px; top: 0; width: 180px; height: 180px; border-radius: 50%;
    background: var(--bg); border: 6px solid var(--shadow); overflow: hidden;
  }
  .gacha .dome i { position: absolute; width: 42px; height: 42px; border-radius: 50%; border: 3px solid var(--card); }
  .gacha .machine {
    position: absolute; left: 0; top: 150px; width: 220px; height: 150px;
    border-radius: 26px 26px 16px 16px; background: var(--accent); box-shadow: 0 6px 0 var(--accent-dark);
  }
  .gacha .knob {
    position: absolute; left: 50%; top: 20px; width: 100px; height: 100px; margin-left: -50px; padding: 0;
    border-radius: 50%; background: var(--card); border: 6px solid var(--accent-dark);
    touch-action: none; cursor: grab;
  }
  .gacha .knob:active { cursor: grabbing; }
  .gacha .knob .bar { position: absolute; left: 50%; top: 6px; bottom: 6px; width: 20px; margin-left: -10px; border-radius: 10px; background: var(--ink); }
  .gacha .knob .bar::after { content: ""; position: absolute; left: 3px; top: 3px; width: 14px; height: 14px; border-radius: 50%; background: var(--star); } /* まわっているのが わかる めじるし */
  .gacha .knob.hint { animation: nudge 1.6s ease-in-out infinite; }
  @keyframes nudge { 0%, 100% { transform: rotate(0); } 50% { transform: rotate(35deg); } }
  .gacha .chute { position: absolute; left: 50%; bottom: 10px; width: 64px; height: 22px; margin-left: -32px; border-radius: 10px; background: var(--ink); }
  .capsule {
    position: absolute; left: 50%; top: 312px; width: 80px; height: 80px; margin-left: -40px;
    border: none; background: none; padding: 0; cursor: pointer; --cap: var(--cap-blue);
  }
  .capsule .top, .capsule .bottom {
    position: absolute; left: 0; width: 80px; height: 40px; border: 3px solid var(--ink);
    transition: transform .5s ease, opacity .5s ease;
  }
  .capsule .top { top: 0; border-radius: 40px 40px 0 0; background: var(--cap); }
  .capsule .bottom { bottom: 0; border-radius: 0 0 40px 40px; background: var(--card); }
  .capsule.gold .top { background: var(--star); box-shadow: 0 0 22px var(--star); }
  .capsule .prize {
    position: absolute; left: 50%; top: 50%; width: 130px; height: 130px; margin: -65px 0 0 -65px;
    display: grid; place-items: center; font-size: 100px; line-height: 1; transform: scale(0);
  }
  .capsule .prize img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; } /* たて長の がぞうも はみださない */
  .capsule.drop { animation: drop .8s cubic-bezier(.3, 1.4, .5, 1); }
  @keyframes drop { 0% { transform: translateY(-60px) scale(.4); opacity: 0; } 30% { opacity: 1; } 100% { transform: none; } }
  .capsule.ready { animation: wiggle 1s ease-in-out infinite; }
  .capsule.open .top { transform: translate(-60px, -50px) rotate(-50deg); opacity: 0; }
  .capsule.open .bottom { transform: translate(60px, 50px) rotate(40deg); opacity: 0; }
  .capsule.open .prize { transform: scale(1); transition: transform .55s cubic-bezier(.2, 1.6, .4, 1) .15s; }
  .gacha-hint { font-size: 17px; font-weight: 800; min-height: 1.4em; margin-top: 4px; }
  .gacha-hint.rare { color: var(--accent); }

  @keyframes wiggle { 0%, 100% { transform: rotate(0); } 10% { transform: rotate(-6deg); } 20% { transform: rotate(6deg); } 30% { transform: rotate(0); } }

  /* login */
  .login-panel { display: flex; flex-direction: column; align-items: center; gap: 12px; }
  .login-panel form { display: flex; flex-direction: column; align-items: center; gap: 12px; width: 100%; }
  .login-panel input {
    width: 100%; max-width: 280px; font: inherit; font-size: 24px; font-weight: 800; text-align: center;
    color: var(--ink); background: var(--bg); border: 3px solid var(--shadow); border-radius: 18px; padding: 12px;
  }
  .login-panel input:focus { outline: none; border-color: var(--sub); }
  .login-panel input.missing { border-color: var(--accent); background: var(--accent-soft); animation: shake .4s; }
  .login-note { font-size: 15px; font-weight: 700; color: var(--good); }
  .login-error { font-size: 15px; font-weight: 700; color: var(--bad); min-height: 1.2em; }
  .user-row { display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 8px; font-size: 15px; font-weight: 700; }
  .user-row .sync { font-size: 13px; color: var(--sub); font-weight: 400; }
  .user-row .secondary { margin-top: 0; font-size: 14px; padding: 6px 14px; box-shadow: 0 3px 0 var(--shadow); }

  .reload-row { display: flex; flex-direction: column; align-items: center; gap: 6px; margin-top: 8px; text-align: center; }
  .reload-row .sub { font-size: 13px; }
  .secondary:active { transform: translateY(3px); box-shadow: 0 2px 0 var(--shadow); }
  .spin { display: inline-block; }
  #reloadBtn.loading { background: var(--accent); color: var(--on-accent); box-shadow: 0 5px 0 var(--accent-dark); }
  #reloadBtn.loading .spin { animation: spin .8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .toast {
    position: fixed; left: 50%; top: calc(16px + env(safe-area-inset-top, 0px)); transform: translateX(-50%);
    background: var(--good); color: var(--on-accent); font-size: 18px; font-weight: 800;
    padding: 12px 22px; border-radius: 999px; box-shadow: 0 4px 0 var(--good-dark); z-index: 30;
    white-space: nowrap; animation: toast 2.4s ease forwards;
  }
  @keyframes toast { 0% { opacity: 0; transform: translate(-50%, -20px); } 12%, 80% { opacity: 1; transform: translate(-50%, 0); } 100% { opacity: 0; transform: translate(-50%, -20px); } }
  .reward-actions { display: flex; flex-wrap: wrap; justify-content: center; gap: 12px; }
  .secondary {
    font: inherit; font-size: 18px; font-weight: 800; color: var(--ink); background: var(--track);
    border: none; border-radius: 999px; padding: 12px 24px; box-shadow: 0 5px 0 var(--shadow);
    cursor: pointer; margin-top: 12px;
  }
</style>
</head>
<body>
<header>
  <div class="left">
    <button class="back-btn" id="backBtn" hidden>🏠 トップ</button>
    <h1 id="title">シールあつめ</h1>
  </div>
  <div class="sprite-zone" id="spriteZone" aria-hidden="true"></div>
  <div class="head-btns">
    <button class="book-btn" id="calBtn" aria-label="カレンダー">📅</button>
    <button class="book-btn" id="bookBtn">📒 シール <span id="stickerCount">0</span></button>
  </div>
</header>

<main id="menu">
  <p class="menu-title">どれに する？</p>
  <div class="kinds" id="kinds"></div>
  <div class="levels" id="levels"></div>
  <div class="reload-row">

<script>
(() => {
  const GOAL = 10;          // 10かい せいかいで シール
  const MINUS = '−';
  const BLANK = null;       // しきの中の「?」

  // ---------- もんだいの しゅるいと レベル ----------
  const rand = (min, max) => min + Math.floor(Math.random() * (max - min + 1));
  const sum = a => a.reduce((x, y) => x + y, 0);

  // たしざん: すべての数が 1〜9（レベル2だけ はじめの数が 19まで）
  function makeAdd(level) {
    for (;;) {
      let nums;
      if (level === 1) { const a = rand(1, 9); nums = [a, rand(1, 10 - a)]; if (sum(nums) > 10) continue; }
      else if (level === 2) { nums = [rand(1, 19), rand(1, 9)]; const t = sum(nums); if (t < 11 || t > 20) continue; }
      else { nums = Array.from({ length: level }, () => rand(1, 9)); if (sum(nums) > 20) continue; }
      return { nums, op: '+', answer: sum(nums) };
    }
  }
  // ひきざん: とちゅうの こたえも 0より 小さくならない
  function makeSub(level) {
    for (;;) {
      let nums;
      if (level === 1) { const a = rand(2, 10); nums = [a, rand(1, a)]; }
      else if (level === 2) { nums = [rand(11, 20), rand(1, 9)]; }
      else { nums = [rand(10, 20), ...Array.from({ length: level - 1 }, () => rand(1, 9))]; }
      const answer = nums[0] - sum(nums.slice(1));
      if (answer < 0) continue;
      return { nums, op: MINUS, answer };
    }
  }
  const asParts = q => [...q.nums.flatMap((n, i) => i ? [q.op, n] : [n]), '=', BLANK];

  const KINDS = {
    make10: {
      label: '10を つくろう', short: '10を\nつくろう', icon: '10',
      levels: [{ ex: `3 + ? = 10`, desc: 'たして 10に なる数' }],
    },
    add: {
      label: 'たしざん', icon: '+',
      levels: [
        { ex: '3 + 4', desc: 'こたえ 10まで' },
        { ex: '8 + 5', desc: 'こたえ 20まで' },
        { ex: '4 + 3 + 6', desc: '2かい たす（20まで）' },
        { ex: '2 + 5 + 3 + 6', desc: '3かい たす（20まで）' },
      ],
    },
    sub: {
      label: 'ひきざん', icon: MINUS,
      levels: [
        { ex: `9 ${MINUS} 4`, desc: '10までの 数から ひく' },
        { ex: `15 ${MINUS} 7`, desc: '20までの 数から ひく' },
        { ex: `17 ${MINUS} 5 ${MINUS} 3`, desc: '2かい ひく' },
        { ex: `19 ${MINUS} 4 ${MINUS} 6 ${MINUS} 2`, desc: '3かい ひく' },
      ],
    },
    clock: {
      label: 'とけい', icon: '🕐',
      levels: [
        { ex: '3じ', desc: 'ちょうど（0ぷん）' },
        { ex: '3じ30ぷん', desc: '30ぷん' },
        { ex: '3じ25ふん', desc: 'ながい はりが すうじに' },
        { ex: '3じ17ふん', desc: 'どこでも' },
      ],
    },
  };

  // ---------- とけい ----------
  // 「ふん」「ぷん」: 1,3,4,6,8,0 で おわる ときは ぷん（いっぷん, さんぷん, じゅっぷん …）
  const pun = m => [0, 1, 3, 4, 6, 8].includes(m % 10) ? 'ぷん' : 'ふん';
  const timeText = (h, m) => m === 0 ? `${h}じ` : `${h}じ${m}${pun(m)}`;
  const wrapH = h => ((h - 1 + 12) % 12) + 1;   // 1〜12 に そろえる

  // レベル1: ちょうど / 2: 30ぷん / 3: 5ふん ごと（ながい はりが すうじの うえ）/ 4: どこでも
  function makeClock(level) {
    const h = rand(1, 12);
    const m = level === 1 ? 0 : level === 2 ? 30 : level === 3 ? rand(0, 11) * 5 : rand(0, 59);
    const okMin = x => level === 1 ? x === 0 : level === 2 ? x === 30 : level === 3 ? x % 5 === 0 : true;
    const opts = new Map();
    const add = (hh, mm) => {
      hh = wrapH(hh); mm = ((mm % 60) + 60) % 60;
      if (okMin(mm) && opts.size < 8) opts.set(hh * 60 + mm, [hh, mm]);
    };
    add(h, m);
    // よくある まちがい を さきに いれる
    add(h + 1, m); add(h - 1, m);                         // みじかい はりの よみまちがい
    if (level >= 3) {
      add(Math.round(m / 5) || 12, (h % 12) * 5);         // ながい はりと みじかい はりを ぎゃくに よむ
      add(h, m + 5); add(h, m - 5); add(h, 60 - m);
    }
    if (level === 4) { add(h, m + 1); add(h, m - 1); add(h, m + 10); }
    while (opts.size < 8) add(rand(1, 12), level === 3 ? rand(0, 11) * 5 : level === 4 ? rand(0, 59) : m);
    const choices = [...opts.values()].sort((a, b) => a[0] - b[0] || a[1] - b[1]).map(([hh, mm]) => timeText(hh, mm));
    return { key: `c${h}:${m}`, clock: [h, m], parts: [BLANK], answer: timeText(h, m), choices, max: 0,
             dots: null, prompt: level === 1 ? 'なんじ かな？' : 'なんじ なんぷん かな？' };
  }

  function drawClock(h, m) {
    const NS = 'http://www.w3.org/2000/svg';
    const svg = document.createElementNS(NS, 'svg');
    svg.setAttribute('viewBox', '0 0 240 240');
    svg.setAttribute('class', 'clock');
    svg.setAttribute('role', 'img');
    svg.setAttribute('aria-label', 'とけい');
    const el = (tag, attrs) => { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); svg.appendChild(e); return e; };
    const C = 120, pt = (deg, len) => [C + len * Math.sin(deg * Math.PI / 180), C - len * Math.cos(deg * Math.PI / 180)];
    el('circle', { cx: C, cy: C, r: 112, class: 'face' });
    for (let i = 0; i < 60; i++) {
      const major = i % 5 === 0, [x1, y1] = pt(i * 6, major ? 92 : 98), [x2, y2] = pt(i * 6, 104);
      el('line', { x1, y1, x2, y2, class: 'tick' + (major ? ' major' : '') });
    }
    for (let n = 1; n <= 12; n++) {
      const [x, y] = pt(n * 30, 74);
      el('text', { x, y, class: 'num' }).textContent = n;
    }
    const [hx, hy] = pt(((h % 12) + m / 60) * 30, 50);
    const [mx, my] = pt(m * 6, 86);
    el('line', { x1: C, y1: C, x2: hx, y2: hy, class: 'hour' });
    el('line', { x1: C, y1: C, x2: mx, y2: my, class: 'minute' });
    el('circle', { cx: C, cy: C, r: 8, class: 'pin' });
    return svg;
  }

  function makeQuestion(kind, level, index) {
    if (kind === 'clock') return makeClock(level);
    if (kind === 'make10') {
      const n = rand(0, 10);
      return { key: 'm' + n, parts: [n, '+', BLANK, '=', 10], answer: 10 - n, max: 10,
               dots: index < 5 ? n : null, // 前半5問だけ 丸を出す
               prompt: 'いくつ たしたら 10 になるかな？' };
    }
    const q = kind === 'add' ? makeAdd(level) : makeSub(level);
    return { key: q.nums.join(q.op), parts: asParts(q), answer: q.answer, max: level === 1 ? 10 : 20,
             dots: null, prompt: 'こたえは いくつかな？' };
  }

  // ---------- シール ----------
  // シールは stickers/ フォルダの がぞう ＋ えもじ（がぞうが ないときは えもじだけ）
  // えもじの シール（レア度1 = いちばん でやすい）。stickers/ の がぞうと まぜて つかう
  const EMOJI_STICKERS = [
    '🐶','🐱','🐰','🐼','🐨','🦁','🐸','🐧','🐥','🦄','🐳','🐬','🦋','🐞','🌻','🌈','🍓','🍩','🍦','🚀',
    '🚂','🚗','⚽','🎈','🎁','👑','💎','🌟','🍀','🦖','🐻','🐯','🐮','🐷','🐵','🐔','🐤','🦊','🐹','🐭',
    '🐺','🐗','🐴','🐝','🐛','🐌','🐢','🐍','🦕','🐙','🦑','🦀','🐠','🐟','🐡','🦈','🐊','🦒','🐘','🦛',
    '🦏','🐪','🦘','🦔','🦉','🦅','🦆','🦢','🦩','🦜','🦦','🦥','🍎','🍊','🍋','🍌','🍉','🍇','🍒','🍑',
    '🍍','🥝','🥕','🌽','🍄','🍞','🧀','🍙','🍣','🍔','🍕','🍟','🍪','🎂','🍰','🍫','🍬','🍭','🧁','🍮',
    '🍡','🌸','🌷','🌹','🌺','🌼','🍁','🌵','🌴','🌙','⭐','🌞','⛄','🔥','💧','⚡','🚁','⛵','🚲','🚌',
    '🚒','🚓','🚑','🚜','🏀','⚾','🎾','🎨','🎹','🥁',
  ];
  let STICKERS = EMOJI_STICKERS;
  const STICKER_DIR = 'stickers/';
  const STORE_KEY = 'make10.stickers';
  const KIND_KEY = 'make10.kind';
  const LOG_KEY = 'make10.log';       // { 'YYYY-MM-DD': その日に もんだいで もらった まいすう }
  const BYLEVEL_KEY = 'make10.byLevel'; // { 'add-2': たしざん レベル2 で もらった まいすう }
  const BONUS_KEY = 'make10.bonus';   // { 'YYYY-MM-DD': れんぞくボーナスで もらった まいすう }

  // フォルダの 画像の 一覧を とってくる。
  // 1) GitHub Actions が作った 一覧ファイル（stickers.json など）があれば それを つかう
  // 2) なければ（ブランチから そのまま 公開しているとき）GitHub に フォルダの なかみを きく
  const IMAGE_RE = /\.(png|jpe?g|gif|webp|avif|svg)$/i;
  async function listImages(folder, jsonName) {
    try {
      const res = await fetch(`${folder}/${jsonName}`, { cache: 'no-cache' });
      if (res.ok) {
        const files = await res.json();
        if (Array.isArray(files)) return files;
      }
    } catch {}
    const host = location.hostname;
    if (!host.endsWith('.github.io')) return [];
    const owner = host.split('.')[0];
    const firstDir = location.pathname.split('/')[1];
    for (const repo of [host, firstDir].filter(Boolean)) {
      try {
        const res = await fetch(`https://api.github.com/repos/${owner}/${repo}/contents/${folder}`);
        if (!res.ok) continue;
        const items = await res.json();
        if (Array.isArray(items)) {
          return items.filter(i => i.type === 'file' && IMAGE_RE.test(i.name)).map(i => i.name)
            .sort((a, b) => a.localeCompare(b, 'ja'));
        }
      } catch {}
    }
    return [];
  }

  async function loadStickerImages() {
    const files = await listImages('stickers', 'stickers.json');
    if (files.length) STICKERS = [...files.map(f => 'img:' + f), ...EMOJI_STICKERS]; // がぞう ＋ えもじ
  }

  // シール1まいを要素に表示する（画像なら <img>、絵文字ならそのまま）
  function showSticker(el, s) {
    el.textContent = '';
    if (s.startsWith('img:')) {
      const img = document.createElement('img');
      img.alt = 'シール';
      // ちいさい ドット絵（128ピクセルまで）は ぼやけないように くっきり
      img.onload = () => { if (Math.max(img.naturalWidth, img.naturalHeight) <= 128) img.style.imageRendering = 'pixelated'; };
      img.src = STICKER_DIR + encodeURIComponent(s.slice(4));
      el.appendChild(img);
    } else {
      el.textContent = s;
    }
  }

  const $ = id => document.getElementById(id);
  const progressEl = $('progress'), equationEl = $('equation'), frameEl = $('frame');
  const msgEl = $('message'), choicesEl = $('choices');

  const DROP_AFTER = 4;     // 1問で 4かい まちがえると レベルが さがる
  let kind = 'make10', level = 1, startLevel = 1, wrongThisQ = 0;
  let correct = 0, current = null, lastKey = null, locked = false, blankEl = null;

  // ---------- storage ----------
  function load(key, fallback) {
    try { const v = JSON.parse(localStorage.getItem(key)); return v ?? fallback; } catch { return fallback; }
  }
  function save(key, value) {
    try { localStorage.setItem(key, JSON.stringify(value)); } catch {}
    if (SYNC_KEYS.includes(key)) scheduleCloudSave();   // クラウドにも ほぞん
  }
  let stickers = load(STORE_KEY, []);
  let byLevel = load(BYLEVEL_KEY, {});
  const levelCount = (k, n) => byLevel[`${k}-${n}`] || 0;
  const kindCount = k => KINDS[k].levels.reduce((t, _, i) => t + levelCount(k, i + 1), 0);
  function updateCount() { $('stickerCount').textContent = stickers.length; }

  // ---------- sound ----------
  let ctx = null;
  function tone(freq, start, dur, type = 'sine', vol = 0.2) {
    try {
      ctx = ctx || new (window.AudioContext || window.webkitAudioContext)();
      const o = ctx.createOscillator(), g = ctx.createGain();
      o.type = type; o.frequency.value = freq;
      g.gain.setValueAtTime(vol, ctx.currentTime + start);
      g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + start + dur);
      o.connect(g).connect(ctx.destination);
      o.start(ctx.currentTime + start); o.stop(ctx.currentTime + start + dur);
    } catch {}
  }
  const sfx = {
    good: () => { tone(784, 0, .15); tone(1047, .1, .25); },
    bad:  () => { tone(220, 0, .25, 'triangle', .25); },
    win:  () => [523, 659, 784, 1047, 1319].forEach((f, i) => tone(f, i * .12, .3, 'triangle')),
  };

  // ---------- トップの アニメーション（スプライトシート） ----------
  // sprites/ の画像を 1つ ランダムに えらび、タイトルの となりの ランダムな場所で うごかす。
  // ファイル名の さいご: _8x1（よこ×たて）, _7f（つかう コマ数）, _12fps（はやさ）。なければ よこ1れつの 正方形コマ。
  const SPRITE_DIR = 'sprites/';
  let SPRITES = [], spriteTimer = null, spriteToken = 0;
  const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;

  async function loadSprites() {
    SPRITES = await listImages('sprites', 'sprites.json');
    if (!$('menu').hidden) showSprite();
  }

  function parseSpriteName(file, img) {
    const base = file.replace(/\.[^.]+$/, '');
    let cols, rows, frames, fps = 8;
    const fpsM = base.match(/_(\d+)fps$/i);
    if (fpsM) fps = Math.max(1, +fpsM[1]);
    const grid = base.match(/_(\d+)x(\d+)(?:_(\d+)f)?(?:_\d+fps)?$/i);
    if (grid) { cols = +grid[1]; rows = +grid[2]; frames = grid[3] ? +grid[3] : cols * rows; }
    else { rows = 1; cols = Math.max(1, Math.round(img.naturalWidth / img.naturalHeight)); frames = cols; }
    cols = Math.max(1, cols); rows = Math.max(1, rows);
    frames = Math.min(Math.max(1, frames), cols * rows);
    return { cols, rows, frames, fps };
  }

  function stopSprite() {
    clearInterval(spriteTimer);
    spriteTimer = null;
    spriteToken++;
    $('spriteZone').innerHTML = '';
  }

  function showSprite() {
    stopSprite();
    if (!SPRITES.length) return;
    const token = spriteToken;
    const file = SPRITES[rand(0, SPRITES.length - 1)];
    const url = SPRITE_DIR + encodeURIComponent(file);
    const img = new Image();
    img.onload = () => {
      if (token !== spriteToken) return; // とちゅうで べつの がめんに なった
      const zone = $('spriteZone');
      const { cols, rows, frames, fps } = parseSpriteName(file, img);
      const fw = img.naturalWidth / cols, fh = img.naturalHeight / rows;
      const zoneW = zone.clientWidth, zoneH = zone.clientHeight;
      let h = zoneH, w = h * fw / fh;
      if (w > zoneW) { w = zoneW; h = w * fh / fw; }
      const el = document.createElement('div');
      el.className = 'sprite';
      Object.assign(el.style, {
        width: w + 'px', height: h + 'px',
        left: Math.random() * Math.max(0, zoneW - w) + 'px',
        top: (zoneH - h) / 2 + 'px',
        backgroundImage: `url("${url}")`,
        backgroundSize: `${cols * 100}% ${rows * 100}%`,
        imageRendering: fh <= 64 ? 'pixelated' : 'auto',
      });
      let i = 0;
      const draw = () => {
        const c = i % cols, r = Math.floor(i / cols);
        el.style.backgroundPosition = `${cols > 1 ? c / (cols - 1) * 100 : 0}% ${rows > 1 ? r / (rows - 1) * 100 : 0}%`;
      };
      draw();
      zone.appendChild(el);
      if (!reduceMotion && frames > 1) spriteTimer = setInterval(() => { i = (i + 1) % frames; draw(); }, 1000 / fps);
    };
    img.src = url;
  }

  // ---------- menu ----------
  function renderMenu() {
    const kindsEl = $('kinds'), levelsEl = $('levels');
    kindsEl.innerHTML = '';
    for (const [id, k] of Object.entries(KINDS)) {
      const b = document.createElement('button');
      b.className = 'kind';
      b.setAttribute('aria-pressed', id === kind);
      b.innerHTML = `<b></b><span></span><small></small>`;
      b.querySelector('b').textContent = k.icon;
      b.querySelector('span').textContent = k.short || k.label;
      b.querySelector('small').textContent = `🏅${kindCount(id)}まい`;
      b.addEventListener('click', () => { kind = id; save(KIND_KEY, id); renderMenu(); });
      kindsEl.appendChild(b);
    }
    levelsEl.innerHTML = '';
    KINDS[kind].levels.forEach((lv, i) => {
      const n = i + 1;
      const b = document.createElement('button');
      b.className = 'level';
      b.innerHTML = `<div class="lv">レベル${n}</div>
        <div class="body"><div class="ex"></div><div class="desc"></div></div>
        <div class="reward">シール<span>${'⭐'.repeat(n)}</span><span class="got">🏅${levelCount(kind, n)}まい</span></div>`;
      b.querySelector('.ex').textContent = lv.ex;
      b.querySelector('.desc').textContent = lv.desc;
      b.addEventListener('click', () => startGame(kind, n));
      levelsEl.appendChild(b);
    });
  }

  function showMenu() {
    $('rewardOverlay').classList.remove('show');
    $('bookOverlay').classList.remove('show');
    $('calOverlay').classList.remove('show');
    $('game').hidden = true;
    $('menu').hidden = false;
    $('backBtn').hidden = true;
    $('title').hidden = false;
    $('spriteZone').hidden = false;
    showSprite();
    renderMenu();
  }

  function startGame(k, lv) {
    kind = k; level = lv; startLevel = lv;
    $('menu').hidden = true;
    $('game').hidden = false;
    $('backBtn').hidden = false;
    $('title').hidden = true;
    $('spriteZone').hidden = true;
    stopSprite();
    renderGameTitle();
    correct = 0;
    lastKey = null;
    renderProgress();
    nextQuestion();
  }

  // ---------- game ----------
  function renderGameTitle() {
    $('gameTitle').textContent = KINDS[kind].levels.length > 1 ? `${KINDS[kind].label} レベル${level}` : KINDS[kind].label;
  }
  const canDrop = () => KINDS[kind].levels.length > 1 && level > 1;

  function renderProgress() {
    progressEl.innerHTML = '';
    for (let i = 0; i < GOAL; i++) {
      const s = document.createElement('span');
      if (i < correct) { s.className = 'on'; s.textContent = '⭐'; }
      progressEl.appendChild(s);
    }
  }

  function renderFrame(n, filled) {
    frameEl.innerHTML = '';
    for (let i = 0; i < 10; i++) {
      const d = document.createElement('i');
      if (i < n) d.className = 'on';
      else if (filled) d.className = 'add';
      frameEl.appendChild(d);
    }
  }

  function renderEquation(parts) {
    equationEl.innerHTML = '';
    equationEl.classList.toggle('long', parts.length > 5);
    for (const p of parts) {
      const s = document.createElement('span');
      if (p === BLANK) { s.className = 'blank'; s.textContent = '?'; blankEl = s; }
      else s.textContent = p;
      equationEl.appendChild(s);
    }
  }

  function shuffle(a) {
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  function nextQuestion() {
    let q;
    do { q = makeQuestion(kind, level, correct); } while (q.key === lastKey);
    lastKey = q.key;
    current = q;

    // 選択肢: 正解 + 近い数を 7つ（ぜんぶで 8つ）、小さい じゅんに ならべる（とけいは もう できている）
    const ok = x => x >= 0 && x <= q.max;
    const opts = q.choices ? [...q.choices] : [q.answer];
    for (let d = 1; !q.choices && opts.length < 8 && d <= 20; d++) {
      for (const x of shuffle([q.answer - d, q.answer + d].filter(ok))) {
        if (opts.length < 8) opts.push(x);
      }
    }
    if (!q.choices) opts.sort((a, b) => a - b);

    renderEquation(q.parts);
    equationEl.classList.toggle('clock-answer', !!q.clock);
    choicesEl.classList.toggle('wide', !!q.clock);
    $('clockBox').innerHTML = '';
    if (q.clock) $('clockBox').appendChild(drawClock(...q.clock));
    frameEl.hidden = q.dots === null;
    if (q.dots !== null) renderFrame(q.dots, false);
    msgEl.textContent = q.prompt;
    msgEl.className = 'message';

    choicesEl.innerHTML = '';
    opts.forEach(v => {
      const b = document.createElement('button');
      b.textContent = v;
      b.addEventListener('click', () => choose(b, v));
      choicesEl.appendChild(b);
    });
    wrongThisQ = 0;
    locked = false;
  }

  // ときどき（3回に1回くらい）名前をつける
  function withName(text) {
    return user && Math.random() < 1 / 3 ? `${user}、${text}` : text;
  }

  function choose(btn, v) {
    if (locked || btn.classList.contains('wrong')) return;
    if (v === current.answer) {
      locked = true;
      btn.classList.add('right');
      choicesEl.querySelectorAll('button').forEach(b => b.disabled = true);
      blankEl.textContent = v;
      blankEl.classList.add('filled');
      if (current.dots !== null) renderFrame(current.dots, true);
      msgEl.textContent = withName(['せいかい！', 'すごい！', 'やったね！', 'ばっちり！'][Math.floor(Math.random() * 4)]);
      msgEl.className = 'message good';
      sfx.good();
      correct++;
      renderProgress();
      setTimeout(() => correct >= GOAL ? giveStickers(level) : nextQuestion(), 1100);
    } else {
      btn.classList.add('wrong');
      wrongThisQ++;
      sfx.bad();
      if (canDrop() && wrongThisQ >= DROP_AFTER) return levelDown();
      msgEl.textContent = canDrop() && wrongThisQ === DROP_AFTER - 1
        ? 'あと1かい まちがえると レベルが さがるよ'
        : withName('おしい！ もういちど');
      msgEl.className = 'message bad';
    }
  }

  // 4かい まちがえたら こたえを みせて、レベルを 1つ さげる（★は ふえない）
  function levelDown() {
    locked = true;
    level--;
    choicesEl.querySelectorAll('button').forEach(b => {
      b.disabled = true;
      if (b.textContent === String(current.answer)) b.classList.add('reveal');
    });
    blankEl.textContent = current.answer;
    msgEl.textContent = `こたえは ${current.answer}。レベル${level}に さがったよ`;
    msgEl.className = 'message bad';
    renderGameTitle();
    tone(392, 0, .2, 'triangle', .2); tone(262, .18, .35, 'triangle', .2);
    setTimeout(nextQuestion, 2200);
  }

  // ---------- reward ----------
  // ファイル名の先頭が「数字2桁_」ならレア度（例: 03_ねこ.png → レア度3）。
  // レア度が大きいほど出にくい（出やすさ = 1 / レア度）。数字がないものはレア度1。
  function rarityOf(s) {
    const m = s.startsWith('img:') && s.slice(4).match(/^(\d{2})_/);
    return m ? Math.max(1, parseInt(m[1], 10)) : 1;
  }
  function pickWeighted(pool) {
    const weights = pool.map(s => 1 / rarityOf(s));
    let r = Math.random() * weights.reduce((x, y) => x + y, 0);
    for (let i = 0; i < pool.length; i++) {
      r -= weights[i];
      if (r < 0) return pool[i];
    }
    return pool[pool.length - 1];
  }

  // レベルの数だけ シールを もらえる（まだ もっていない シールから先に えらぶ）
  // シールを count まい えらんで ほぞんする（まだ もっていない シールから先に）
  function awardStickers(count) {
    const got = [];
    for (let i = 0; i < count; i++) {
      const owned = new Set(stickers);
      const fresh = STICKERS.filter(s => !owned.has(s));
      const notToday = STICKERS.filter(s => !got.includes(s));
      const pool = fresh.length ? fresh : (notToday.length ? notToday : STICKERS);
      const s = pickWeighted(pool);
      stickers.push(s);
      got.push(s);
    }
    save(STORE_KEY, stickers);
    updateCount();
    return got;
  }

  // ごほうび画面を だす。from: 'game'（もんだいを 10かい せいかい）か 'calendar'（れんぞくボーナス）
  function showReward(got, title, info, from) {
    const count = got.length;
    const box = $('rewardStickers');
    box.innerHTML = '';
    box.classList.toggle('many', count > 1);
    got.forEach((s, i) => {
      const d = document.createElement('div');
      d.className = 'sticker-big';
      d.style.animationDelay = i * 0.25 + 's';
      showSticker(d, s);
      box.appendChild(d);
    });
    $('rewardTitle').textContent = title;
    $('rewardInfo').textContent = info;
    $('againBtn').hidden = from !== 'game';
    $('menuBtn').hidden = from !== 'game';
    $('calBackBtn').hidden = from !== 'calendar';
    $('rewardOverlay').classList.add('show');
    sfx.win();
    confetti();
  }

  function giveStickers(count) {
    const got = awardStickers(count);
    const key = dayKey(new Date());
    log[key] = (log[key] || 0) + count;
    save(LOG_KEY, log);
    const lk = `${kind}-${level}`;              // おわったときの レベルで かぞえる
    byLevel[lk] = (byLevel[lk] || 0) + count;
    save(BYLEVEL_KEY, byLevel);
    playGacha(got, () => showReward(got, '10かい せいかい！', count < startLevel
      ? `レベル${startLevel}から レベル${count}に さがったので、シールは ${count}まい`
      : `シールを ${count}まい もらったよ`, 'game'));
  }

  // ---------- ガチャ ----------
  // もらう シールを 1まいずつ、ハンドルを ゆびで くるっと 1しゅう まわして だす → カプセルを タップして あける
  const CAP_COLORS = ['var(--cap-blue)', 'var(--cap-pink)', 'var(--good)', 'var(--accent)'];
  const gacha = { queue: [], index: 0, done: null, total: 0, last: 0, dragging: false, ticks: 0, dispensed: false, opened: false };

  function fillDome() {
    const dome = $('gachaDome');
    dome.innerHTML = '';
    for (let i = 0; i < 14; i++) {
      const ball = document.createElement('i');
      ball.style.left = (8 + (i % 4) * 38 + (Math.floor(i / 4) % 2) * 19) + 'px';
      ball.style.top = (150 - 34 - Math.floor(i / 4) * 30) + 'px';
      ball.style.background = CAP_COLORS[i % CAP_COLORS.length];
      dome.appendChild(ball);
    }
  }

  function playGacha(got, done) {
    if (!got.length) return done();
    Object.assign(gacha, { queue: got, index: 0, done });
    fillDome();
    $('gachaOverlay').classList.add('show');
    resetGacha();
  }

  function resetGacha() {
    Object.assign(gacha, { total: 0, dragging: false, ticks: 0, dispensed: false, opened: false });
    const knob = $('gachaKnob'), cap = $('gachaCap');
    knob.style.transform = '';
    knob.classList.add('hint');
    cap.hidden = true;
    cap.className = 'capsule';
    $('gachaPrize').innerHTML = '';
    $('gachaCount').textContent = `${gacha.index + 1}まいめ ／ ${gacha.queue.length}まい`;
    $('gachaHint').textContent = '↻ ハンドルを くるっと まわしてね';
    $('gachaHint').className = 'gacha-hint';
    $('gachaNext').hidden = true;
    $('gachaOverlay').scrollTop = 0;
  }

  function knobAngle(e) {
    const r = $('gachaKnob').getBoundingClientRect();
    return Math.atan2(e.clientY - (r.top + r.height / 2), e.clientX - (r.left + r.width / 2));
  }

  function turnKnob(delta) {
    gacha.total += delta;
    const deg = gacha.total * 180 / Math.PI;
    const knob = $('gachaKnob');
    knob.classList.remove('hint');
    knob.style.transform = `rotate(${deg}deg)`;
    const ticks = Math.floor(Math.abs(deg) / 45);
    if (ticks > gacha.ticks) { gacha.ticks = ticks; tone(500 + ticks * 60, 0, .05, 'square', .08); }  // カチカチ
    if (Math.abs(deg) >= 360) dispense();
  }

  function dispense() {
    if (gacha.dispensed) return;
    gacha.dispensed = true;
    gacha.dragging = false;
    const s = gacha.queue[gacha.index];
    const cap = $('gachaCap');
    const rare = rarityOf(s) >= 3;
    cap.className = 'capsule drop' + (rare ? ' gold' : '');
    cap.style.setProperty('--cap', CAP_COLORS[rand(0, CAP_COLORS.length - 1)]);
    showSticker($('gachaPrize'), s);
    cap.hidden = false;
    tone(330, 0, .12, 'triangle', .2); tone(250, .25, .12, 'triangle', .2);   // ゴロン
    $('gachaHint').textContent = rare ? '✨ キラキラの カプセル！ タップして あけてね' : 'カプセルを タップして あけてね！';
    $('gachaHint').className = 'gacha-hint' + (rare ? ' rare' : '');
    setTimeout(() => { if (!gacha.opened) cap.classList.add('ready'); }, 800);
  }

  const knob = $('gachaKnob');
  knob.addEventListener('pointerdown', e => {
    if (gacha.dispensed) return;
    e.preventDefault();
    gacha.dragging = true;
    gacha.last = knobAngle(e);
    try { knob.setPointerCapture(e.pointerId); } catch {}
  });
  knob.addEventListener('pointermove', e => {
    if (!gacha.dragging || gacha.dispensed) return;
    const a = knobAngle(e);
    let d = a - gacha.last;
    if (d > Math.PI) d -= 2 * Math.PI;
    if (d < -Math.PI) d += 2 * Math.PI;
    gacha.last = a;
    turnKnob(d);
  });
  ['pointerup', 'pointercancel', 'lostpointercapture'].forEach(t => knob.addEventListener(t, () => { gacha.dragging = false; }));
  // キーボードでも まわせる（1かい 90ど）
  knob.addEventListener('keydown', e => {
    if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); if (!gacha.dispensed) turnKnob(Math.PI / 2); }
  });

  $('gachaCap').addEventListener('click', () => {
    if (!gacha.dispensed || gacha.opened) return;
    gacha.opened = true;
    const cap = $('gachaCap');
    cap.classList.remove('ready', 'drop');
    cap.classList.add('open');
    sfx.good();
    const last = gacha.index >= gacha.queue.length - 1;
    $('gachaHint').textContent = cap.classList.contains('gold') ? '✨ レアな シール！' : 'やったね！';
    $('gachaNext').textContent = last ? 'シールを みる' : 'つぎの ガチャ';
    setTimeout(() => { $('gachaNext').hidden = false; }, 500);
  });

  $('gachaNext').addEventListener('click', () => {
    gacha.index++;
    if (gacha.index < gacha.queue.length) return resetGacha();
    $('gachaOverlay').classList.remove('show');
    gacha.done();
  });

  // ---------- calendar ----------
  let log = load(LOG_KEY, {}), bonus = load(BONUS_KEY, {});
  const pad = n => String(n).padStart(2, '0');
  const dayKey = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
  const addDays = (d, n) => new Date(d.getFullYear(), d.getMonth(), d.getDate() + n);

  // その日までの れんぞく日数（その日に もらっていなければ 0）
  function streakAt(d) {
    let n = 0;
    while (log[dayKey(addDays(d, -n))] > 0) n++;
    return n;
  }

  const WEEK = ['にち', 'げつ', 'か', 'すい', 'もく', 'きん', 'ど'];
  let wheelLock = 0, calPos = null; // calPos: ボーナスを もらう まえに みていた 月

  function buildMonth(year, month, today) {
    const wrap = document.createElement('div');
    wrap.className = 'cal-month';
    const h = document.createElement('h3');
    h.textContent = `${year}ねん ${month + 1}がつ`;
    const grid = document.createElement('div');
    grid.className = 'cal-grid';
    WEEK.forEach((w, i) => {
      const c = document.createElement('div');
      c.className = 'wd' + (i === 0 ? ' sun' : '');
      c.textContent = w;
      grid.appendChild(c);
    });
    const first = new Date(year, month, 1);
    for (let i = 0; i < first.getDay(); i++) {
      const c = document.createElement('div');
      c.className = 'day blank';
      grid.appendChild(c);
    }
    const days = new Date(year, month + 1, 0).getDate();
    for (let dd = 1; dd <= days; dd++) {
      const d = new Date(year, month, dd), key = dayKey(d);
      const got = log[key] || 0;
      const streak = got ? streakAt(d) : 0;
      const claimable = streak >= 2 && !bonus[key];
      const c = document.createElement(claimable ? 'button' : 'div');
      c.className = 'day' + (got ? ' has' : '') + (key === dayKey(today) ? ' today' : '') + (claimable ? ' claim' : '');
      const n = document.createElement('span'); n.className = 'n'; n.textContent = dd; c.appendChild(n);
      if (got) { const g = document.createElement('span'); g.className = 'got'; g.textContent = `⭐${got}`; c.appendChild(g); }
      if (claimable) {
        const b = document.createElement('span'); b.className = 'bonus'; b.textContent = `🎁${streak}`; c.appendChild(b);
        c.setAttribute('aria-label', `${month + 1}がつ${dd}にち ${streak}にち れんぞく。おすと シール ${streak}まい`);
        c.addEventListener('click', () => claimBonus(key, streak));
      } else if (bonus[key]) {
        const b = document.createElement('span'); b.className = 'bonus'; b.textContent = '✅'; c.appendChild(b);
      }
      grid.appendChild(c);
    }
    wrap.append(h, grid);
    return wrap;
  }

  // 月の はんい: いちばん むかしの きろく（なければ 2か月まえ）〜 らいげつ
  function openCalendar(keepScroll) {
    const strip = $('calStrip');
    const today = new Date();
    const keys = Object.keys(log).filter(k => log[k] > 0).sort();
    let start = new Date(today.getFullYear(), today.getMonth() - 2, 1);
    if (keys.length) {
      const [y, m] = keys[0].split('-').map(Number);
      const first = new Date(y, m - 1, 1);
      if (first < start) start = first;
    }
    strip.innerHTML = '';
    let index = 0, current = 0;
    for (let d = start; d <= new Date(today.getFullYear(), today.getMonth() + 1, 1); d = new Date(d.getFullYear(), d.getMonth() + 1, 1)) {
      if (d.getFullYear() === today.getFullYear() && d.getMonth() === today.getMonth()) current = index;
      strip.appendChild(buildMonth(d.getFullYear(), d.getMonth(), today));
      index++;
    }
    $('calOverlay').classList.add('show');
    strip.scrollLeft = (keepScroll && calPos !== null ? calPos : current) * strip.clientWidth;
    updateCalArrows();
  }

  function calIndex() { const strip = $('calStrip'); return Math.round(strip.scrollLeft / strip.clientWidth); }
  function scrollCal(dir) {
    const strip = $('calStrip');
    const i = Math.min(Math.max(calIndex() + dir, 0), strip.children.length - 1);
    strip.scrollTo({ left: i * strip.clientWidth, behavior: 'smooth' });
  }
  function updateCalArrows() {
    const strip = $('calStrip'), i = calIndex();
    $('calPrev').disabled = i <= 0;
    $('calNext').disabled = i >= strip.children.length - 1;
  }

  function claimBonus(key, streak) {
    if (bonus[key]) return;
    calPos = calIndex();
    const got = awardStickers(streak);
    bonus[key] = streak;
    save(BONUS_KEY, bonus);
    $('calOverlay').classList.remove('show');
    const [, m, d] = key.split('-').map(Number);
    playGacha(got, () => showReward(got, `${streak}にち れんぞく！`, `${m}がつ${d}にちの ボーナスで シールを ${streak}まい もらったよ`, 'calendar'));
  }

  $('calBtn').addEventListener('click', () => openCalendar(false));
  $('closeCal').addEventListener('click', () => $('calOverlay').classList.remove('show'));
  $('calPrev').addEventListener('click', () => scrollCal(-1));
  $('calNext').addEventListener('click', () => scrollCal(1));
  $('calStrip').addEventListener('scroll', updateCalArrows, { passive: true });
  // パソコンの マウスホイールでも 月を かえられる
  $('calStrip').addEventListener('wheel', e => {
    if (Math.abs(e.deltaY) <= Math.abs(e.deltaX)) return;
    e.preventDefault();
    const now = Date.now();
    if (now - wheelLock < 450) return;
    wheelLock = now;
    scrollCal(Math.sign(e.deltaY));
  }, { passive: false });
  $('calBackBtn').addEventListener('click', () => {
    $('rewardOverlay').classList.remove('show');
    openCalendar(true);
  });

  function confetti() {
    const items = ['🎉', '⭐', '✨', '🎊', '💖'];
    for (let i = 0; i < 30; i++) {
      const c = document.createElement('div');
      c.className = 'confetti';
      c.textContent = items[i % items.length];
      c.style.left = Math.random() * 100 + 'vw';
      c.style.animationDuration = 2 + Math.random() * 2 + 's';
      c.style.animationDelay = Math.random() * .6 + 's';
      document.body.appendChild(c);
      setTimeout(() => c.remove(), 5000);
    }
  }

  $('againBtn').addEventListener('click', () => {
    $('rewardOverlay').classList.remove('show');
    startGame(kind, startLevel);
  });
  $('menuBtn').addEventListener('click', showMenu);
  $('backBtn').addEventListener('click', showMenu);
  $('bookTopBtn').addEventListener('click', showMenu);
  // ページを よみこみなおす（シールは ブラウザに ほぞんしてあるので そのまま）
  // おしたら くるくる まわして「よみこみちゅう…」→ よみこんだあと「よみこみ できたよ！」を だす
  const RELOAD_FLAG = 'make10.reloaded';
  $('reloadBtn').addEventListener('click', () => {
    const btn = $('reloadBtn');
    if (btn.classList.contains('loading')) return;
    save(STORE_KEY, stickers);
    btn.classList.add('loading');
    $('reloadLabel').textContent = 'よみこみちゅう…';
    tone(660, 0, .12); tone(880, .1, .15);
    try { sessionStorage.setItem(RELOAD_FLAG, '1'); } catch {}
    setTimeout(() => location.reload(), 700);
  });
  function showToast(text) {
    const t = document.createElement('div');
    t.className = 'toast';
    t.setAttribute('role', 'status');
    t.textContent = text;
    document.body.appendChild(t);
    setTimeout(() => t.remove(), 2600);
  }
  try {
    if (sessionStorage.getItem(RELOAD_FLAG)) {
      sessionStorage.removeItem(RELOAD_FLAG);
      showToast(`✅ よみこみ できたよ！ シール ${stickers.length}まい`);
    }
  } catch {}

  // ---------- sticker book ----------
  function openBook() {
    const book = $('book');
    book.innerHTML = '';
    const total = Math.max(STICKERS.length, Math.ceil(stickers.length / 5) * 5);
    for (let i = 0; i < total; i++) {
      const d = document.createElement('div');
      if (i < stickers.length) showSticker(d, stickers[i]);
      else { d.className = 'empty'; d.textContent = '・'; }
      book.appendChild(d);
    }
    $('bookInfo').textContent = stickers.length
      ? `${stickers.length}まい あつめたよ！`
      : 'まだ シールが ないよ。10かい せいかいすると もらえるよ！';
    // しゅるいごとの まいすう（もんだい / カレンダーの ボーナス / かぞえはじめる まえの ぶん）
    const sum = $('bookSummary');
    sum.innerHTML = '';
    const rows = Object.entries(KINDS).map(([id, k]) => [k.icon, k.label, kindCount(id)]);
    const bonusTotal = Object.values(bonus).reduce((a, b) => a + b, 0);
    rows.push(['📅', 'ボーナス', bonusTotal]);
    const counted = rows.reduce((a, r) => a + r[2], 0);
    if (stickers.length > counted) rows.push(['📦', 'まえから', stickers.length - counted]);
    if (stickers.length) for (const [icon, label, n] of rows) {
      const d = document.createElement('div');
      d.className = 'item';
      d.innerHTML = '<span class="icon"></span><span></span><b></b>';
      d.children[0].textContent = icon;
      d.children[1].textContent = label;
      d.children[2].textContent = `${n}まい`;
      sum.appendChild(d);
    }
    $('bookTopBtn').hidden = !$('menu').hidden; // トップにいるときは いらない
    $('bookOverlay').classList.add('show');
  }
  $('bookBtn').addEventListener('click', openBook);
  $('closeBook').addEventListener('click', () => $('bookOverlay').classList.remove('show'));

  // ---------- ログインと クラウド ほぞん（Firebase Firestore） ----------
  // データは Firestore の users/{なまえ} に ほぞんする。ブラウザにも コピーを おいておき、
  // つながらない ときも あそべるように している。
  const FIREBASE = { apiKey: 'AIzaSyCdVNAU_JfY1xAsn853z1tSH45tY_sE6U8', projectId: 'count-1106d' };
  const USER_KEY = 'make10.user';
  const DIRTY_KEY = 'make10.dirty'; // まだ クラウドに おくれていない かわりが ある
  const SYNC_KEYS = [STORE_KEY, LOG_KEY, BONUS_KEY, KIND_KEY, BYLEVEL_KEY];
  let user = load(USER_KEY, null);
  let synced = false;        // クラウドの データを 1かい よみこんだら true（それまでは うわがきしない）
  let saveTimer = null, applying = false;

  const docUrl = name => `https://firestore.googleapis.com/v1/projects/${FIREBASE.projectId}/databases/(default)/documents/users/${encodeURIComponent(name)}?key=${FIREBASE.apiKey}`;

  // JavaScript の あたい ⇔ Firestore REST の あたい
  function toFs(v) {
    if (v === null || v === undefined) return { nullValue: null };
    if (typeof v === 'boolean') return { booleanValue: v };
    if (typeof v === 'number') return Number.isInteger(v) ? { integerValue: String(v) } : { doubleValue: v };
    if (typeof v === 'string') return { stringValue: v };
    if (v instanceof Date) return { timestampValue: v.toISOString() };
    if (Array.isArray(v)) return { arrayValue: v.length ? { values: v.map(toFs) } : {} };
    const fields = {};
    for (const k in v) fields[k] = toFs(v[k]);
    return { mapValue: { fields } };
  }
  function fromFs(v) {
    if ('nullValue' in v) return null;
    if ('booleanValue' in v) return v.booleanValue;
    if ('integerValue' in v) return Number(v.integerValue);
    if ('doubleValue' in v) return v.doubleValue;
    if ('stringValue' in v) return v.stringValue;
    if ('timestampValue' in v) return v.timestampValue;
    if ('arrayValue' in v) return (v.arrayValue.values || []).map(fromFs);
    if ('mapValue' in v) { const o = {}; const f = v.mapValue.fields || {}; for (const k in f) o[k] = fromFs(f[k]); return o; }
    return null;
  }

  function setSync(text) { $('syncStatus').textContent = text; }

  // クラウドの データを よむ。ない ときは null、つながらない ときは エラー
  async function cloudGet(name) {
    const res = await fetch(docUrl(name), { cache: 'no-store' });
    if (res.status === 404) return null;
    if (!res.ok) throw new Error('get ' + res.status);
    const doc = await res.json();
    const f = doc.fields || {};
    return {
      stickers: f.stickers ? fromFs(f.stickers) : [],
      log: f.log ? fromFs(f.log) : {},
      bonus: f.bonus ? fromFs(f.bonus) : {},
      kind: f.kind ? fromFs(f.kind) : null,
      byLevel: f.byLevel ? fromFs(f.byLevel) : {},
    };
  }

  async function cloudPut(keepalive = false) {
    const body = { fields: toFs({ name: user, stickers, log, bonus, kind, byLevel, updatedAt: new Date() }).mapValue.fields };
    const res = await fetch(docUrl(user), { method: 'PATCH', keepalive, headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
    if (!res.ok) throw new Error('put ' + res.status);
    try { localStorage.removeItem(DIRTY_KEY); } catch {}
  }
  const isDirty = () => { try { return !!localStorage.getItem(DIRTY_KEY); } catch { return false; } };

  function scheduleCloudSave() {
    if (!user || applying) return;
    try { localStorage.setItem(DIRTY_KEY, '1'); } catch {}
    clearTimeout(saveTimer);
    setSync('☁️ ほぞんちゅう…');
    saveTimer = setTimeout(flushCloudSave, 600);
  }
  async function flushCloudSave() {
    clearTimeout(saveTimer); saveTimer = null;
    if (!user) return;
    try {
      if (!synced) await syncFromCloud();   // まだ クラウドを よんでいない ときは さきに よむ
      await cloudPut();
      setSync('☁️ ほぞんずみ');
    } catch {
      setSync('⚠️ ほぞんできませんでした（つながったら また ほぞんします）');
    }
  }

  // クラウドの データを ブラウザに いれる
  function applyData(d) {
    applying = true;
    stickers = d.stickers; log = d.log; bonus = d.bonus; byLevel = d.byLevel || {};
    if (d.kind && KINDS[d.kind]) kind = d.kind;
    save(STORE_KEY, stickers); save(LOG_KEY, log); save(BONUS_KEY, bonus); save(KIND_KEY, kind); save(BYLEVEL_KEY, byLevel);
    applying = false;
    updateCount();
    if (!$('menu').hidden) renderMenu();
  }

  // ログインまえに あつめた シールを、クラウドの データに くわえる
  function mergeInto(remote, local) {
    const out = { stickers: [...remote.stickers, ...local.stickers], log: { ...remote.log }, bonus: { ...remote.bonus, ...local.bonus }, kind: remote.kind || local.kind };
    for (const k in local.log) out.log[k] = (out.log[k] || 0) + local.log[k];
    out.byLevel = { ...(remote.byLevel || {}) };
    for (const k in local.byLevel) out.byLevel[k] = (out.byLevel[k] || 0) + local.byLevel[k];
    return out;
  }

  // ログイン ちゅう: クラウドが ただしい データ。（ログインした ときだけ、まえの データを まぜる）
  async function syncFromCloud(mergeLocal = false) {
    const remote = await cloudGet(user);
    const local = { stickers, log, bonus, kind, byLevel };
    const keepLocal = !mergeLocal && isDirty();   // まだ おくれていない あたらしい データが ある
    if (remote && !keepLocal) applyData(mergeLocal ? mergeInto(remote, local) : remote);
    synced = true;
    if (!remote || mergeLocal || keepLocal) await cloudPut();
    setSync('☁️ ほぞんずみ');
  }

  function showUser() {
    $('userName').textContent = user || '';
    $('rewardName').textContent = user || '';
  }

  function showLogin() {
    const n = stickers.length;
    $('loginNote').hidden = n === 0;
    $('loginNote').textContent = `いまの シール ${n}まいは そのまま つかえるよ`;
    $('loginError').textContent = '';
    $('loginOverlay').classList.add('show');
    setTimeout(() => $('loginName').focus(), 50);
  }

  $('loginName').addEventListener('input', () => {
    $('loginName').classList.remove('missing');
    $('loginError').textContent = '';
  });

  $('loginForm').addEventListener('submit', async e => {
    e.preventDefault();
    const name = $('loginName').value.trim();
    if (!name) {
      $('loginName').classList.remove('missing');
      void $('loginName').offsetWidth;            // もういちど ゆらすため
      $('loginName').classList.add('missing');
      $('loginError').textContent = 'なまえを いれてね';
      $('loginName').focus();
      return;
    }
    if (name.includes('/') || name === '.' || name === '..' || /^__.*__$/.test(name)) {
      $('loginError').textContent = 'この なまえは つかえないよ'; return;
    }
    $('loginBtn').disabled = true;
    $('loginError').textContent = '';
    user = name;
    save(USER_KEY, user);
    showUser();
    synced = false;
    try {
      await syncFromCloud(true);
    } catch {
      setSync('⚠️ つながっていません（あとで ほぞんします）');
    }
    $('loginBtn').disabled = false;
    $('loginOverlay').classList.remove('show');
    $('loginName').value = '';
  });

  // ログアウト: 2かい おしたら。データは クラウドに のこして、ブラウザからは けす
  let logoutArmed = 0;
  $('logoutBtn').addEventListener('click', async () => {
    if (Date.now() - logoutArmed > 3000) {
      logoutArmed = Date.now();
      $('logoutBtn').textContent = 'もういちど おすと ログアウト';
      setTimeout(() => { $('logoutBtn').textContent = 'ログアウト'; }, 3000);
      return;
    }
    $('logoutBtn').disabled = true;
    try { await flushCloudSave(); } catch {}
    applying = true;
    stickers = []; log = {}; bonus = {}; byLevel = {};
    save(STORE_KEY, stickers); save(LOG_KEY, log); save(BONUS_KEY, bonus); save(BYLEVEL_KEY, byLevel);
    applying = false;
    try { localStorage.removeItem(USER_KEY); localStorage.removeItem(DIRTY_KEY); } catch {}
    user = null; synced = false;
    $('logoutBtn').disabled = false;
    $('logoutBtn').textContent = 'ログアウト';
    showUser(); updateCount(); setSync('');
    showMenu();
    showLogin();
  });

  // アプリを とじる ときや べつの アプリに うつる ときは すぐ ほぞん。もどってきたら クラウドを よみなおす
  addEventListener('pagehide', () => { if (saveTimer && user && synced) { clearTimeout(saveTimer); cloudPut(true).catch(() => {}); } });
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'hidden' && saveTimer) flushCloudSave();
    else if (document.visibilityState === 'visible' && user && !saveTimer) syncFromCloud().catch(() => {});
  });

  const savedKind = load(KIND_KEY, 'make10');
  if (KINDS[savedKind]) kind = savedKind;
  updateCount();
  showMenu();
  showUser();
  if (user) syncFromCloud().catch(() => setSync('⚠️ つながっていません'));
  else showLogin();
  loadStickerImages();
  loadSprites();
})();
</script>
</body>
