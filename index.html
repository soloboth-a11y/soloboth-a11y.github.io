<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>10をつくろう</title>
<style>
  :root {
    --bg: #fff8e7;
    --card: #ffffff;
    --ink: #3b3355;
    --sub: #8a83a3;
    --accent: #ff8a5b;
    --accent-dark: #e86a3a;
    --good: #3cc47c;
    --good-dark: #2a9a5f;
    --good-soft: #e8fbf1;
    --bad: #ff5b6e;
    --bad-soft: #ffe3e7;
    --dot: #ff8a5b;
    --dot-empty: #efe9f7;
    --dot-line: #d8cfe8;
    --track: #f1ecdf;
    --star: #ffe27a;
    --shadow: #e6dcc4;
    --on-accent: #ffffff;
    --muted: #d6ccb4;
    --scrim: rgba(59, 51, 85, .55);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #1f1b2e; --card: #2c2740; --ink: #f4efff; --sub: #a9a1c4;
      --accent: #ff9a6e; --accent-dark: #c9592e; --good: #4fd68e; --good-dark: #2a9a5f;
      --good-soft: #1f3b2e; --bad: #ff7585; --bad-soft: #43242c; --dot: #ff9a6e;
      --dot-empty: #3a3452; --dot-line: #554d70; --track: #3a3452; --star: #c9a92e;
      --shadow: #151221; --on-accent: #ffffff; --muted: #5d5678; --scrim: rgba(0,0,0,.6);
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #1f1b2e; --card: #2c2740; --ink: #f4efff; --sub: #a9a1c4;
    --accent: #ff9a6e; --accent-dark: #c9592e; --good: #4fd68e; --good-dark: #2a9a5f;
    --good-soft: #1f3b2e; --bad: #ff7585; --bad-soft: #43242c; --dot: #ff9a6e;
    --dot-empty: #3a3452; --dot-line: #554d70; --track: #3a3452; --star: #c9a92e;
    --shadow: #151221; --on-accent: #ffffff; --muted: #5d5678; --scrim: rgba(0,0,0,.6);
    color-scheme: dark;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: "Hiragino Maru Gothic ProN", "Rounded Mplus 1c", "M PLUS Rounded 1c", "Yu Gothic", system-ui, sans-serif;
    display: flex; flex-direction: column; align-items: center;
    padding-block: 16px;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    user-select: none;
  }
  header { width: 100%; max-width: 520px; display: flex; justify-content: space-between; align-items: center; }
  h1 { font-size: 22px; margin: 0; letter-spacing: .05em; }
  .book-btn {
    border: none; background: var(--card); color: var(--ink); font: inherit; font-size: 16px;
    padding: 8px 14px; border-radius: 999px; box-shadow: 0 2px 0 var(--shadow); cursor: pointer;
  }
  main { width: 100%; max-width: 520px; display: flex; flex-direction: column; gap: 16px; margin-top: 16px; }

  .progress { display: grid; grid-template-columns: repeat(10, 1fr); gap: 6px; }
  .progress span {
    aspect-ratio: 1; border-radius: 50%; background: var(--track);
    display: grid; place-items: center; font-size: clamp(14px, 4.5vw, 24px);
    transition: transform .3s;
  }
  .progress span.on { background: var(--star); transform: scale(1.1); }

  .card {
    background: var(--card); border-radius: 28px; padding: 24px 16px;
    box-shadow: 0 4px 0 var(--shadow); text-align: center;
  }
  .equation { font-size: clamp(48px, 16vw, 84px); font-weight: 800; display: flex; justify-content: center; align-items: center; gap: .25em; }
  .blank {
    display: inline-grid; place-items: center; min-width: 1.3em; height: 1.3em;
    border: 4px dashed var(--accent); border-radius: 18px; color: var(--accent);
  }
  .blank.filled { border-style: solid; background: var(--good-soft); border-color: var(--good); color: var(--good); }

  .frame { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; max-width: 300px; margin: 18px auto 0; }
  .frame[hidden] { display: none; }
  .frame i {
    aspect-ratio: 1; border-radius: 50%; background: var(--dot-empty);
    border: 3px dashed var(--dot-line); transition: background .3s, border-color .3s;
  }
  .frame i.on { background: var(--dot); border: 3px solid var(--dot); }
  .frame i.add { background: var(--good); border: 3px solid var(--good); }

  .choices { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
  .choices button {
    font: inherit; font-size: clamp(40px, 12vw, 60px); font-weight: 800; color: var(--ink);
    background: var(--card); border: none; border-radius: 24px; padding: 14px 0;
    box-shadow: 0 6px 0 var(--shadow); cursor: pointer; transition: transform .08s;
  }
  .choices button:active { transform: translateY(4px); box-shadow: 0 2px 0 var(--shadow); }
  .choices button.wrong { background: var(--bad-soft); color: var(--bad); animation: shake .4s; }
  .choices button.right { background: var(--good); color: var(--on-accent); box-shadow: 0 6px 0 var(--good-dark); }
  .choices button:disabled { cursor: default; }
  @keyframes shake { 0%,100%{transform:translateX(0)} 25%{transform:translateX(-8px)} 75%{transform:translateX(8px)} }

  .message { text-align: center; font-size: 22px; min-height: 1.5em; font-weight: 700; }
  .message.good { color: var(--good); }
  .message.bad { color: var(--bad); }

  /* overlays */
  .overlay {
    position: fixed; inset: 0; background: var(--scrim);
    display: none; align-items: center; justify-content: center; padding: 16px; z-index: 10;
  }
  .overlay.show { display: flex; }
  .panel {
    background: var(--card); border-radius: 28px; padding: 24px 20px; width: 100%; max-width: 420px;
    text-align: center; max-height: 90vh; overflow-y: auto;
  }
  .panel h2 { margin: 0 0 8px; font-size: 26px; }
  .sticker-big {
    font-size: 120px; line-height: 1; margin: 12px 0;
    animation: pop .7s cubic-bezier(.2, 1.6, .4, 1);
  }
  @keyframes pop { 0%{transform:scale(0) rotate(-30deg)} 100%{transform:scale(1) rotate(0)} }
  .primary {
    font: inherit; font-size: 22px; font-weight: 800; color: var(--on-accent); background: var(--accent);
    border: none; border-radius: 999px; padding: 12px 32px; box-shadow: 0 5px 0 var(--accent-dark);
    cursor: pointer; margin-top: 12px;
  }
  .primary:active { transform: translateY(3px); box-shadow: 0 2px 0 var(--accent-dark); }
  .book { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; margin: 16px 0; }
  .book div {
    aspect-ratio: 1; border-radius: 16px; background: var(--track);
    display: grid; place-items: center; font-size: 34px;
  }
  .sticker-big img { width: 160px; height: 160px; max-width: 100%; object-fit: contain; display: block; margin: 0 auto; }
  .book div { overflow: hidden; }
  .book div img { width: 85%; height: 85%; object-fit: contain; }
  .book div.empty { color: var(--muted); font-size: 20px; }
  button:focus-visible { outline: 4px solid var(--accent); outline-offset: 3px; }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .01ms !important; transition: none !important; }
    .confetti { display: none; }
  }
  .sub { color: var(--sub); font-size: 15px; }

  .confetti { position: fixed; top: -40px; font-size: 28px; pointer-events: none; z-index: 20; animation: fall linear forwards; }
  @keyframes fall { to { transform: translateY(110vh) rotate(540deg); } }

  [hidden] { display: none !important; }
  header .left { display: flex; align-items: center; gap: 10px; min-width: 0; }
  header h1 { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 20px; }
  .book-btn { white-space: nowrap; flex-shrink: 0; }
  .back-btn {
    border: none; background: var(--card); color: var(--ink); font: inherit; font-size: 16px; font-weight: 700;
    padding: 6px 14px; font-size: 20px; border-radius: 999px; box-shadow: 0 2px 0 var(--shadow); cursor: pointer; white-space: nowrap;
  }

  /* menu */
  .menu-title { font-size: 20px; font-weight: 800; margin: 4px 0 0; text-align: center; }
  .kinds { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  .kind {
    font: inherit; font-size: 15px; font-weight: 800; color: var(--ink); background: var(--card);
    border: none; border-radius: 20px; padding: 12px 4px; box-shadow: 0 4px 0 var(--shadow); cursor: pointer;
    display: flex; flex-direction: column; align-items: center; gap: 2px;
  }
  .kind b { font-size: 34px; line-height: 1.1; }
  .kind[aria-pressed="true"] { background: var(--accent); color: var(--on-accent); box-shadow: 0 4px 0 var(--accent-dark); }
  .levels { display: flex; flex-direction: column; gap: 12px; }
  .level {
    display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 14px;
    font: inherit; color: var(--ink); text-align: left; background: var(--card); border: none;
    border-radius: 22px; padding: 14px 16px; box-shadow: 0 5px 0 var(--shadow); cursor: pointer;
  }
  .level:active { transform: translateY(3px); box-shadow: 0 2px 0 var(--shadow); }
  .level .lv { font-size: 18px; font-weight: 800; white-space: nowrap; color: var(--accent); }
  .level .body { min-width: 0; }
  .level .ex { font-size: 22px; font-weight: 800; white-space: nowrap; }
  .level .desc { font-size: 13px; color: var(--sub); }
  .level .reward { font-size: 12px; color: var(--sub); text-align: center; white-space: nowrap; }
  .level .reward span { display: block; font-size: 16px; letter-spacing: -2px; }

  .equation { flex-wrap: wrap; }
  .equation.long { font-size: clamp(28px, 8.5vw, 56px); gap: .18em; }
  .blank { padding: 0 .12em; }

  .reward-stickers { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; margin: 12px 0; }
  .reward-stickers .sticker-big { margin: 0; animation-fill-mode: both; }
  .reward-stickers.many .sticker-big { font-size: 56px; }
  .reward-stickers.many .sticker-big img { width: 64px; height: 64px; }
  .reward-actions { display: flex; flex-wrap: wrap; justify-content: center; gap: 12px; }
  .secondary {
    font: inherit; font-size: 18px; font-weight: 800; color: var(--ink); background: var(--track);
    border: none; border-radius: 999px; padding: 12px 24px; box-shadow: 0 5px 0 var(--shadow);
    cursor: pointer; margin-top: 12px;
  }
</style>
</head>
<body>
<header>
  <div class="left">
    <button class="back-btn" id="backBtn" aria-label="メニューに もどる" hidden>←</button>
    <h1 id="title">けいさん れんしゅう</h1>
  </div>
  <button class="book-btn" id="bookBtn">📒 シール <span id="stickerCount">0</span></button>
</header>

<main id="menu">
  <p class="menu-title">どれに する？</p>
  <div class="kinds" id="kinds"></div>
  <div class="levels" id="levels"></div>
</main>

<main id="game" hidden>
  <div class="progress" id="progress"></div>

  <div class="card">
    <div class="equation" id="equation"></div>
    <div class="frame" id="frame"></div>
  </div>

  <div class="message" id="message"></div>

  <div class="choices" id="choices"></div>
</main>

<div class="overlay" id="rewardOverlay">
  <div class="panel">
    <h2>花ちゃん、<br>10かい せいかい！</h2>
    <div class="sub" id="rewardInfo">シールを もらったよ</div>
    <div class="reward-stickers" id="rewardStickers"></div>
    <div class="reward-actions">
      <button class="primary" id="againBtn">もういちど</button>
      <button class="secondary" id="menuBtn">メニューへ</button>
    </div>
  </div>
</div>

<div class="overlay" id="bookOverlay">
  <div class="panel">
    <h2>📒 シールちょう</h2>
    <div class="sub" id="bookInfo"></div>
    <div class="book" id="book"></div>
    <button class="primary" id="closeBook">とじる</button>
  </div>
</div>

<script>
(() => {
  const GOAL = 10;          // 10かい せいかいで シール
  const MINUS = '−';
  const BLANK = null;       // しきの中の「?」

  // ---------- もんだいの しゅるいと レベル ----------
  const rand = (min, max) => min + Math.floor(Math.random() * (max - min + 1));
  const sum = a => a.reduce((x, y) => x + y, 0);

  // たしざん: すべての数が 1〜9（レベル2だけ はじめの数が 19まで）
  function makeAdd(level) {
    for (;;) {
      let nums;
      if (level === 1) { const a = rand(1, 9); nums = [a, rand(1, 10 - a)]; if (sum(nums) > 10) continue; }
      else if (level === 2) { nums = [rand(1, 19), rand(1, 9)]; const t = sum(nums); if (t < 11 || t > 20) continue; }
      else { nums = Array.from({ length: level }, () => rand(1, 9)); if (sum(nums) > 20) continue; }
      return { nums, op: '+', answer: sum(nums) };
    }
  }
  // ひきざん: とちゅうの こたえも 0より 小さくならない
  function makeSub(level) {
    for (;;) {
      let nums;
      if (level === 1) { const a = rand(2, 10); nums = [a, rand(1, a)]; }
      else if (level === 2) { nums = [rand(11, 20), rand(1, 9)]; }
      else { nums = [rand(10, 20), ...Array.from({ length: level - 1 }, () => rand(1, 9))]; }
      const answer = nums[0] - sum(nums.slice(1));
      if (answer < 0) continue;
      return { nums, op: MINUS, answer };
    }
  }
  const asParts = q => [...q.nums.flatMap((n, i) => i ? [q.op, n] : [n]), '=', BLANK];

  const KINDS = {
    make10: {
      label: '10を つくろう', icon: '10',
      levels: [{ ex: `3 + ? = 10`, desc: 'たして 10に なる数' }],
    },
    add: {
      label: 'たしざん', icon: '+',
      levels: [
        { ex: '3 + 4', desc: 'こたえ 10まで' },
        { ex: '8 + 5', desc: 'こたえ 20まで' },
        { ex: '4 + 3 + 6', desc: '2かい たす（20まで）' },
        { ex: '2 + 5 + 3 + 6', desc: '3かい たす（20まで）' },
      ],
    },
    sub: {
      label: 'ひきざん', icon: MINUS,
      levels: [
        { ex: `9 ${MINUS} 4`, desc: '10までの 数から ひく' },
        { ex: `15 ${MINUS} 7`, desc: '20までの 数から ひく' },
        { ex: `17 ${MINUS} 5 ${MINUS} 3`, desc: '2かい ひく' },
        { ex: `19 ${MINUS} 4 ${MINUS} 6 ${MINUS} 2`, desc: '3かい ひく' },
      ],
    },
  };

  function makeQuestion(kind, level, index) {
    if (kind === 'make10') {
      const n = rand(0, 10);
      return { key: 'm' + n, parts: [n, '+', BLANK, '=', 10], answer: 10 - n, max: 10,
               dots: index < 5 ? n : null, // 前半5問だけ 丸を出す
               prompt: 'いくつ たしたら 10 になるかな？' };
    }
    const q = kind === 'add' ? makeAdd(level) : makeSub(level);
    return { key: q.nums.join(q.op), parts: asParts(q), answer: q.answer, max: level === 1 ? 10 : 20,
             dots: null, prompt: 'こたえは いくつかな？' };
  }

  // ---------- シール ----------
  // stickers/ フォルダに画像があればそれを使い、なければ絵文字を使う
  const EMOJI_STICKERS = ['🐶','🐱','🐰','🐼','🐨','🦁','🐸','🐧','🐥','🦄','🐳','🐬','🦋','🐞','🌻','🌈','🍓','🍩','🍦','🚀','🚂','🚗','⚽','🎈','🎁','👑','💎','🌟','🍀','🦖'];
  let STICKERS = EMOJI_STICKERS;
  const STICKER_DIR = 'stickers/';
  const STORE_KEY = 'make10.stickers';
  const KIND_KEY = 'make10.kind';

  async function loadStickerImages() {
    try {
      const res = await fetch(STICKER_DIR + 'stickers.json', { cache: 'no-cache' });
      if (!res.ok) return;
      const files = await res.json();
      if (Array.isArray(files) && files.length) STICKERS = files.map(f => 'img:' + f);
    } catch {}
  }

  // シール1まいを要素に表示する（画像なら <img>、絵文字ならそのまま）
  function showSticker(el, s) {
    el.textContent = '';
    if (s.startsWith('img:')) {
      const img = document.createElement('img');
      img.src = STICKER_DIR + encodeURIComponent(s.slice(4));
      img.alt = 'シール';
      el.appendChild(img);
    } else {
      el.textContent = s;
    }
  }

  const $ = id => document.getElementById(id);
  const progressEl = $('progress'), equationEl = $('equation'), frameEl = $('frame');
  const msgEl = $('message'), choicesEl = $('choices');

  let kind = 'make10', level = 1;
  let correct = 0, current = null, lastKey = null, locked = false, blankEl = null;

  // ---------- storage ----------
  function load(key, fallback) {
    try { const v = JSON.parse(localStorage.getItem(key)); return v ?? fallback; } catch { return fallback; }
  }
  function save(key, value) {
    try { localStorage.setItem(key, JSON.stringify(value)); } catch {}
  }
  let stickers = load(STORE_KEY, []);
  function updateCount() { $('stickerCount').textContent = stickers.length; }

  // ---------- sound ----------
  let ctx = null;
  function tone(freq, start, dur, type = 'sine', vol = 0.2) {
    try {
      ctx = ctx || new (window.AudioContext || window.webkitAudioContext)();
      const o = ctx.createOscillator(), g = ctx.createGain();
      o.type = type; o.frequency.value = freq;
      g.gain.setValueAtTime(vol, ctx.currentTime + start);
      g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + start + dur);
      o.connect(g).connect(ctx.destination);
      o.start(ctx.currentTime + start); o.stop(ctx.currentTime + start + dur);
    } catch {}
  }
  const sfx = {
    good: () => { tone(784, 0, .15); tone(1047, .1, .25); },
    bad:  () => { tone(220, 0, .25, 'triangle', .25); },
    win:  () => [523, 659, 784, 1047, 1319].forEach((f, i) => tone(f, i * .12, .3, 'triangle')),
  };

  // ---------- menu ----------
  function renderMenu() {
    const kindsEl = $('kinds'), levelsEl = $('levels');
    kindsEl.innerHTML = '';
    for (const [id, k] of Object.entries(KINDS)) {
      const b = document.createElement('button');
      b.className = 'kind';
      b.setAttribute('aria-pressed', id === kind);
      b.innerHTML = `<b></b><span></span>`;
      b.querySelector('b').textContent = k.icon;
      b.querySelector('span').textContent = k.label;
      b.addEventListener('click', () => { kind = id; save(KIND_KEY, id); renderMenu(); });
      kindsEl.appendChild(b);
    }
    levelsEl.innerHTML = '';
    KINDS[kind].levels.forEach((lv, i) => {
      const n = i + 1;
      const b = document.createElement('button');
      b.className = 'level';
      b.innerHTML = `<div class="lv">レベル${n}</div>
        <div class="body"><div class="ex"></div><div class="desc"></div></div>
        <div class="reward">シール<span>${'⭐'.repeat(n)}</span></div>`;
      b.querySelector('.ex').textContent = lv.ex;
      b.querySelector('.desc').textContent = lv.desc;
      b.addEventListener('click', () => startGame(kind, n));
      levelsEl.appendChild(b);
    });
  }

  function showMenu() {
    $('rewardOverlay').classList.remove('show');
    $('game').hidden = true;
    $('menu').hidden = false;
    $('backBtn').hidden = true;
    $('title').textContent = 'けいさん れんしゅう';
    renderMenu();
  }

  function startGame(k, lv) {
    kind = k; level = lv;
    $('menu').hidden = true;
    $('game').hidden = false;
    $('backBtn').hidden = false;
    $('title').textContent = KINDS[k].levels.length > 1 ? `${KINDS[k].label} レベル${lv}` : KINDS[k].label;
    correct = 0;
    lastKey = null;
    renderProgress();
    nextQuestion();
  }

  // ---------- game ----------
  function renderProgress() {
    progressEl.innerHTML = '';
    for (let i = 0; i < GOAL; i++) {
      const s = document.createElement('span');
      if (i < correct) { s.className = 'on'; s.textContent = '⭐'; }
      progressEl.appendChild(s);
    }
  }

  function renderFrame(n, filled) {
    frameEl.innerHTML = '';
    for (let i = 0; i < 10; i++) {
      const d = document.createElement('i');
      if (i < n) d.className = 'on';
      else if (filled) d.className = 'add';
      frameEl.appendChild(d);
    }
  }

  function renderEquation(parts) {
    equationEl.innerHTML = '';
    equationEl.classList.toggle('long', parts.length > 5);
    for (const p of parts) {
      const s = document.createElement('span');
      if (p === BLANK) { s.className = 'blank'; s.textContent = '?'; blankEl = s; }
      else s.textContent = p;
      equationEl.appendChild(s);
    }
  }

  function shuffle(a) {
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  function nextQuestion() {
    let q;
    do { q = makeQuestion(kind, level, correct); } while (q.key === lastKey);
    lastKey = q.key;
    current = q;

    // 選択肢: 正解 + 近い数を中心に3つ
    const ok = x => x >= 0 && x <= q.max;
    const opts = new Set([q.answer]);
    const near = shuffle([-1, 1, -2, 2].map(d => q.answer + d).filter(ok));
    for (const x of near) { if (opts.size < 4) opts.add(x); }
    for (const d of [3, -3, 4, -4, 5, -5]) { if (opts.size < 4 && ok(q.answer + d)) opts.add(q.answer + d); }

    renderEquation(q.parts);
    frameEl.hidden = q.dots === null;
    if (q.dots !== null) renderFrame(q.dots, false);
    msgEl.textContent = q.prompt;
    msgEl.className = 'message';

    choicesEl.innerHTML = '';
    shuffle([...opts]).forEach(v => {
      const b = document.createElement('button');
      b.textContent = v;
      b.addEventListener('click', () => choose(b, v));
      choicesEl.appendChild(b);
    });
    locked = false;
  }

  // ときどき（3回に1回くらい）名前をつける
  const NAME = '花ちゃん';
  function withName(text) {
    return Math.random() < 1 / 3 ? `${NAME}、${text}` : text;
  }

  function choose(btn, v) {
    if (locked || btn.classList.contains('wrong')) return;
    if (v === current.answer) {
      locked = true;
      btn.classList.add('right');
      choicesEl.querySelectorAll('button').forEach(b => b.disabled = true);
      blankEl.textContent = v;
      blankEl.classList.add('filled');
      if (current.dots !== null) renderFrame(current.dots, true);
      msgEl.textContent = withName(['せいかい！', 'すごい！', 'やったね！', 'ばっちり！'][Math.floor(Math.random() * 4)]);
      msgEl.className = 'message good';
      sfx.good();
      correct++;
      renderProgress();
      setTimeout(() => correct >= GOAL ? giveStickers(level) : nextQuestion(), 1100);
    } else {
      btn.classList.add('wrong');
      msgEl.textContent = withName('おしい！ もういちど');
      msgEl.className = 'message bad';
      sfx.bad();
    }
  }

  // ---------- reward ----------
  // ファイル名の先頭が「数字2桁_」ならレア度（例: 03_ねこ.png → レア度3）。
  // レア度が大きいほど出にくい（出やすさ = 1 / レア度）。数字がないものはレア度1。
  function rarityOf(s) {
    const m = s.startsWith('img:') && s.slice(4).match(/^(\d{2})_/);
    return m ? Math.max(1, parseInt(m[1], 10)) : 1;
  }
  function pickWeighted(pool) {
    const weights = pool.map(s => 1 / rarityOf(s));
    let r = Math.random() * weights.reduce((x, y) => x + y, 0);
    for (let i = 0; i < pool.length; i++) {
      r -= weights[i];
      if (r < 0) return pool[i];
    }
    return pool[pool.length - 1];
  }

  // レベルの数だけ シールを もらえる（まだ もっていない シールから先に えらぶ）
  function giveStickers(count) {
    const got = [];
    for (let i = 0; i < count; i++) {
      const owned = new Set(stickers);
      const fresh = STICKERS.filter(s => !owned.has(s));
      const notToday = STICKERS.filter(s => !got.includes(s));
      const pool = fresh.length ? fresh : (notToday.length ? notToday : STICKERS);
      const s = pickWeighted(pool);
      stickers.push(s);
      got.push(s);
    }
    save(STORE_KEY, stickers);
    updateCount();

    const box = $('rewardStickers');
    box.innerHTML = '';
    box.classList.toggle('many', count > 1);
    got.forEach((s, i) => {
      const d = document.createElement('div');
      d.className = 'sticker-big';
      d.style.animationDelay = i * 0.25 + 's';
      showSticker(d, s);
      box.appendChild(d);
    });
    $('rewardInfo').textContent = `シールを ${count}まい もらったよ`;
    $('rewardOverlay').classList.add('show');
    sfx.win();
    confetti();
  }

  function confetti() {
    const items = ['🎉', '⭐', '✨', '🎊', '💖'];
    for (let i = 0; i < 30; i++) {
      const c = document.createElement('div');
      c.className = 'confetti';
      c.textContent = items[i % items.length];
      c.style.left = Math.random() * 100 + 'vw';
      c.style.animationDuration = 2 + Math.random() * 2 + 's';
      c.style.animationDelay = Math.random() * .6 + 's';
      document.body.appendChild(c);
      setTimeout(() => c.remove(), 5000);
    }
  }

  $('againBtn').addEventListener('click', () => {
    $('rewardOverlay').classList.remove('show');
    startGame(kind, level);
  });
  $('menuBtn').addEventListener('click', showMenu);
  $('backBtn').addEventListener('click', showMenu);

  // ---------- sticker book ----------
  function openBook() {
    const book = $('book');
    book.innerHTML = '';
    const total = Math.max(STICKERS.length, Math.ceil(stickers.length / 5) * 5);
    for (let i = 0; i < total; i++) {
      const d = document.createElement('div');
      if (i < stickers.length) showSticker(d, stickers[i]);
      else { d.className = 'empty'; d.textContent = '・'; }
      book.appendChild(d);
    }
    $('bookInfo').textContent = stickers.length
      ? `${stickers.length}まい あつめたよ！`
      : 'まだ シールが ないよ。10かい せいかいすると もらえるよ！';
    $('bookOverlay').classList.add('show');
  }
  $('bookBtn').addEventListener('click', openBook);
  $('closeBook').addEventListener('click', () => $('bookOverlay').classList.remove('show'));

  const savedKind = load(KIND_KEY, 'make10');
  if (KINDS[savedKind]) kind = savedKind;
  updateCount();
  showMenu();
  loadStickerImages();
})();
</script>
</body>
</html>
